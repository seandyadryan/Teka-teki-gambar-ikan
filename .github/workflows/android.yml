name: Android build
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify localizations
        run: python3 tools/verify_localizations.py
      - name: Check and package
        run: ./gradlew --no-daemon :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: fish-riddle-club-android
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
